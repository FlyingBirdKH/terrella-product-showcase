<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 两步流程 · 合成数据演示</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f1e8;color:#27221e;font-family:system-ui,sans-serif}header,main,nav,footer{max-width:1160px;margin:20px auto;padding:0 20px}h1{font-size:26px}p{line-height:1.7}.filters{display:flex;gap:12px;flex-wrap:wrap}button{font:inherit;padding:9px 14px;min-height:44px;border:1px solid #c5ac90;border-radius:8px;background:white;cursor:pointer}.product-row{display:grid;grid-template-columns:2fr 1fr;background:#fffdf8;border:1px solid #e0d6c7;border-radius:14px;margin:20px 0;padding:20px;gap:20px}.gallery{display:flex;gap:12px;overflow:auto}.gallery-item{width:48%;min-width:230px;margin:0}.fake-image{aspect-ratio:1;background:#eee5d7;border-radius:8px;display:grid;place-items:center;color:#6b5c49;border:1px dashed #baa88d}.fake-image span{padding:25px;text-align:center;line-height:2}.body h2{font-size:20px}.badge{padding:4px 8px;background:#eee3d2;border-radius:5px}.note{color:#795b36}.media-row-label{margin:15px 0}.intent-box{margin:10px 0!important}footer{font-size:13px;color:#705b45}@media(max-width:700px){.product-row{grid-template-columns:1fr;padding:12px}.gallery-item{min-width:240px}.body{order:-1}}
</style><link rel="stylesheet" href="controls.css"></head><body>
<header><span class="badge">合成数据 · 不含真实产品</span><h1>先选产品出图，再逐张确认</h1><p>这是可操作的交互与状态预览。两款产品、文件地址和哈希都是测试夹具，不代表任何真实商品或批准。</p></header>
<nav class="filters" id="filters"><button type="button" data-filter="all">全部演示产品</button><button type="button" data-filter="held">仅身份待核</button></nav><main id="app"></main><footer>未连接身份服务、审批数据库、生成器或上传器。不会访问正式产品册、Bunny 或正式商店。真实产品资料不包含在本演示中。</footer>
<script>
const PRODUCTS=[{sku:'CAT-900',code:'DEMO-900',name:'演示产品 A'},{sku:'CAT-901',code:'DEMO-901',name:'演示产品 B（身份待核）'}];
const IDENTITY_HOLDS=new Set(['CAT-901']);let selectedFilter='all';
const AI_GALLERY={'CAT-900':{version:'demo-v1',images:[1,2].map(i=>({path:`https://images.example.invalid/products/demo/CAT-900/ai/demo-v1/ai-CAT-900-0${i}.png`,assignedSku:'CAT-900',outputSha256:String(i).repeat(64),kind:'ai',version:'demo-v1'}))}};
const unchangedIdentity=()=>true;const imagesFor=p=>p.sku==='CAT-900'?[{fixture:true}]:[];const aiImagesFor=p=>AI_GALLERY[p.sku]?.images||[];
function render(){document.getElementById('app').innerHTML=PRODUCTS.filter(p=>selectedFilter==='all'||IDENTITY_HOLDS.has(p.sku)).map(p=>`<article class="product-row" data-sku="${p.sku}"><div><div class="media-row-label">合成 AI 候选图 · 非真实图像</div><div class="gallery ai-gallery">${aiImagesFor(p).map((a,i)=>`<figure class="gallery-item"><div class="fake-image"><span>演示候选 ${i+1}<br>仅用于交互测试<br>没有生成真实图片</span></div><figcaption>合成文件 ${i+1} · demo-v1</figcaption></figure>`).join('')||'<p class="note">身份与原图待核，不能申请出图。</p>'}</div></div><div class="body"><h2>${p.name}</h2><p>${p.sku} · ${p.code}</p><p class="note">所有状态均为测试草稿。</p></div></article>`).join('');}
document.getElementById('filters').addEventListener('click',e=>{if(!e.target.dataset.filter)return;selectedFilter=e.target.dataset.filter;render();});render();
</script><script src="intent-contract.cjs"></script><script src="controls.js"></script></body></html>
