<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CAT-001 内部预览 · 非正式商城</title>
<style>
  :root { --bg:#f7f1e8; --ink:#1c1917; --muted:#78716c; --card:#fffdf8; --line:#e7e0d4; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: "Iowan Old Style", Palatino, "Songti SC", serif; background:var(--bg); color:var(--ink); }
  header, main, footer { max-width: 1100px; margin: 0 auto; padding: 24px 20px; }
  h1 { margin: 0 0 8px; font-size: clamp(1.4rem, 3vw, 2rem); }
  .banner { margin: 0 0 12px; padding: 10px 12px; border: 2px solid #9a3412; background: #fff7ed; color: #9a3412; font-weight: 700; }
  p { margin: 0 0 10px; line-height: 1.5; }
  .muted { color: var(--muted); }
  form { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; margin: 12px 0; }
  button[disabled] { opacity: .55; cursor: not-allowed; }
  ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
  li { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  figure { margin: 0; }
  img { width: 100%; aspect-ratio: 1; object-fit: contain; background: #f1ebe1; display: block; }
  figcaption { padding: 10px 12px 12px; font-size: .82rem; line-height: 1.45; }
  code { background: #efe7da; padding: 1px 6px; border-radius: 4px; word-break: break-all; }
  #chosen li { padding: 8px 0; border-bottom: 1px solid var(--line); }
  #save-status { font-weight: 700; }
</style>
</head>
<body>
<header>
  <p class="banner" role="status">内部预览 · 非公开 · 不是正式商城</p>
  <h1>CAT-001 已选图片的内部预览</h1>
  <p class="muted">商品 ID <code id="product-id"></code>，SKU CAT-001，货号 TR260002。勾选只写入 terrella-product-db 的 product_image_selections。没有预览访问口令时写入关闭。公开产品册不需要登录。</p>
  <p><button type="button" id="publish-unavailable" disabled>正式上架/下架不可用</button></p>
  <form id="preview-sign-in">
    <label>预览访问口令 <input id="preview-secret" type="password" autocomplete="off"></label>
    <button type="submit">打开勾选写入</button>
    <button type="button" id="preview-logout">退出</button>
  </form>
  <p id="save-status" role="status">勾选写入默认关闭。没有口令时不能当成已保存。</p>
</header>
<main>
  <h2>勾选</h2>
  <ol id="frames" aria-label="内部预览勾选"></ol>
  <h2>当前内部预览</h2>
  <p class="muted">这里只显示 terrella-product-db 里已读回的图片。</p>
  <ol id="chosen" aria-label="已保存的内部预览"></ol>
</main>
<footer class="muted">这不是正式商城商品页。这一页不合并、不部署。</footer>
<script type="module">
import { failureText, previewFetch, readStatus, writeStatus } from './internal-preview-client.mjs';

const PRODUCT_ID = '0f057213-b8af-4982-9e44-582a2a1d3469';
const SKU = 'CAT-001';
const IMAGES = [
  { order: 1, shortId: '001·ff4696', sha256: 'ff4696836d2ac0320db1bf247cd8e89e3760795c696caf0bbf61ffeb3033f342', path: 'https://terralla-internal.b-cdn.net/products/eastern-heritage/CAT-001/ai/20261110-recovered/ai-CAT-001-recovered-01-ff469683.png' },
  { order: 2, shortId: '001·af3760', sha256: 'af3760c6b82472fcc1999dec44079feb5089613ccc6e247b4a9c94acfc7746c4', path: 'https://terralla-internal.b-cdn.net/products/eastern-heritage/CAT-001/ai/20261110-recovered/ai-CAT-001-recovered-02-af3760c6.png' },
  { order: 3, shortId: '001·2f8919', sha256: '2f89191684cdab6756eafe1e4c116d801a36451cd6bc1f3be3c647f19929f44d', path: 'https://terralla-internal.b-cdn.net/products/eastern-heritage/CAT-001/ai/20261110-recovered/ai-CAT-001-recovered-03-2f891916.png' },
  { order: 4, shortId: '001·91cd1d', sha256: '91cd1d7d67d7bacfba741d14c26dc340789a0836412518af4241fe0bb4a3fa0c', path: 'https://terralla-internal.b-cdn.net/products/eastern-heritage/CAT-001/ai/20261110-recovered/ai-CAT-001-recovered-04-91cd1d7d.png' }
];
const status = document.getElementById('save-status');
document.getElementById('product-id').textContent = PRODUCT_ID;
let selected = new Set();
let readable = false;
function esc(value) {
  return String(value).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function paint() {
  document.getElementById('frames').innerHTML = IMAGES.map((item) => `<li><label><input type="checkbox" data-sha="${esc(item.sha256)}" ${selected.has(item.sha256) ? 'checked' : ''} ${readable ? '' : 'disabled'}> ${item.order}. <code>${esc(item.shortId)}</code></label><div>SHA-256 <code>${esc(item.sha256)}</code></div></li>`).join('');
  const chosen = IMAGES.filter((item) => selected.has(item.sha256));
  document.getElementById('chosen').innerHTML = chosen.length
    ? chosen.map((item) => `<li><figure><img alt="内部预览 ${esc(item.shortId)}" src="${esc(item.path)}"><figcaption><div><code>${esc(item.shortId)}</code></div><div>SHA-256 <code>${esc(item.sha256)}</code></div><div><a href="${esc(item.path)}" target="_blank" rel="noopener noreferrer">打开 Bunny 原图</a></div></figcaption></figure></li>`).join('')
    : '<li>当前没有读回的内部预览图片。商品行还在。Bunny 原件没有被删除。</li>';
}
function failClosed(reason) {
  readable = false;
  selected = new Set();
  status.textContent = failureText(reason);
  paint();
}
async function load() {
  const response = await previewFetch(`/api/internal-preview?productId=${PRODUCT_ID}&sku=${SKU}`, { cache: 'no-store' });
  const data = await response.json().catch(() => null);
  const interpreted = readStatus(data);
  if (!response.ok || !interpreted.ok || !data || data.productId !== PRODUCT_ID) {
    failClosed(data && data.reason);
    return;
  }
  readable = true;
  selected = new Set(data.selected);
  status.textContent = interpreted.text;
  paint();
}
document.getElementById('preview-sign-in').addEventListener('submit', async (event) => {
  event.preventDefault();
  const input = document.getElementById('preview-secret');
  const secret = input.value;
  input.value = '';
  status.textContent = '正在核对预览访问口令。图片还没有保存。';
  try {
    const response = await fetch('/api/internal-preview/session', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ secret })
    });
    const data = await response.json().catch(() => null);
    if (!response.ok || !data || data.signedIn !== true) {
      failClosed(data && data.reason);
      return;
    }
    await load();
  } catch {
    failClosed('store-not-writable');
  }
});
document.getElementById('preview-logout').addEventListener('click', async () => {
  const input = document.getElementById('preview-secret');
  if (input) input.value = '';
  try {
    await fetch('/api/internal-preview/session', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ action: 'logout' })
    });
  } catch {}
  failClosed('anonymous');
  status.textContent = '已退出。数据库里的勾选没有被删除。';
});
document.getElementById('frames').addEventListener('change', async (event) => {
  const box = event.target.closest('input[data-sha]');
  if (!box || !readable) return;
  const sha256 = box.dataset.sha;
  const want = box.checked;
  status.textContent = want ? '正在写入 terrella-product-db。还没有保存。' : '正在去掉这张图的勾选。还没有保存。Bunny 原图不会删除。';
  try {
    const response = await previewFetch('/api/internal-preview', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ productId: PRODUCT_ID, sku: SKU, sha256, selected: want })
    });
    const data = await response.json().catch(() => null);
    const interpreted = writeStatus(data, { sha256, want });
    if (!response.ok || !interpreted.ok || !data || data.productId !== PRODUCT_ID) throw new Error(data && data.reason);
    selected = new Set(data.selected);
    status.textContent = interpreted.text;
    paint();
  } catch (error) {
    box.checked = !want;
    status.textContent = failureText(error && error.message);
  }
});
paint();
load().catch(() => failClosed('store-not-writable'));
</script>
</body>
</html>
